[workspace]
resolver = "2"
members = [
    "ritsu-server",
    "ritsu",
    "ritsu-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ritsu Contributors"]
repository = "https://github.com/ritsu/ritsu"
readme = "README.md"
keywords = ["ai", "agent", "automation"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# Common dependencies
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

# Configuration
toml = "0.9"

# IPC
postcard = { version = "1.1", features = ["alloc"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# GUI
iced = { version = "0.14", features = ["tokio", "advanced"] }
iced_widget = { version = "0.14", features = ["svg"] }
"lucide-icons" = { version = "*", features = ["iced"] }

# Notifications
notify-rust = "4.12"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# HTTP client for LLM APIs
reqwest = { version = "0.13", features = ["json"] }

# Internal crates
ritsu-common = { path = "ritsu-common" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"
multiple_crate_versions = "allow"
# Allow overly pedantic lints that don't add much value
items_after_statements = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
significant_drop_tightening = "allow"
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
